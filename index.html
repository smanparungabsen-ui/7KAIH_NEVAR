<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    const lucideIcons = window.lucideReact || {};
    const FallbackIcon = () => <span></span>;

    const BookOpen = lucideIcons.BookOpen || FallbackIcon;
    const ShieldCheck = lucideIcons.ShieldCheck || FallbackIcon;
    const UserCheck = lucideIcons.UserCheck || FallbackIcon;
    const Users = lucideIcons.Users || FallbackIcon;
    const CloudDownload = lucideIcons.CloudDownload || FallbackIcon;
    const LogOut = lucideIcons.LogOut || FallbackIcon;
    const CheckCircle = lucideIcons.CheckCircle || FallbackIcon;
    const Activity = lucideIcons.Activity || FallbackIcon;
    const Book = lucideIcons.Book || FallbackIcon;
    const Printer = lucideIcons.Printer || FallbackIcon;
    const PenTool = lucideIcons.PenTool || FallbackIcon;
    const FileText = lucideIcons.FileText || FallbackIcon;
    const User = lucideIcons.User || FallbackIcon;
    const Award = lucideIcons.Award || FallbackIcon;
    const AlertTriangle = lucideIcons.AlertTriangle || FallbackIcon;
    const ChartPie = lucideIcons.ChartPie || FallbackIcon;
    const CalendarCheck = lucideIcons.CalendarCheck || FallbackIcon;
    const FileSpreadsheet = lucideIcons.FileSpreadsheet || FallbackIcon;
    const Edit = lucideIcons.Edit || FallbackIcon;
    const Eraser = lucideIcons.Eraser || FallbackIcon;
    const X = lucideIcons.X || FallbackIcon;

    // Bersih dari Data Demo
    const DEFAULT_USERS = [];
    const DEFAULT_AKUN = [];
    const MOCK_AKADEMIK_DATA = {};
    
    // URL Web App GAS Hardcoded Sesuai Permintaan
    const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzi5zG_i1MnzeeEAFG3X749REKOjMKD3CW53Us8efXR4b4vz3nn9jMdoMR03-LTtyLE/exec";

    const HABITS_INFO = [
        { key: 'bangun_pagi', label: '1. Bangun Pagi', short: 'Bangun' },
        { key: 'ibadah', label: '2. Ibadah', short: 'Ibadah' },
        { key: 'olahraga', label: '3. Olahraga', short: 'Olahraga' },
        { key: 'makan', label: '4. Makan Sehat', short: 'Makan' },
        { key: 'belajar', label: '5. Belajar', short: 'Belajar' },
        { key: 'masyarakat', label: '6. Bermasyarakat', short: 'Sosial' },
        { key: 'tidur', label: '7. Tidur Cepat', short: 'Tidur' }
    ];

    const SignatureCanvas = ({ onSave, onCancel, roleTitle }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if(canvas) {
          const parent = canvas.parentElement;
          canvas.width = parent.offsetWidth * 2;
          canvas.height = parent.offsetHeight * 2;
          const ctx = canvas.getContext('2d');
          ctx.scale(2, 2);
          ctx.lineCap = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#0f172a';
        }
      }, []);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDraw = (e) => { setIsDrawing(true); draw(e); };
      const endDraw = () => { setIsDrawing(false); canvasRef.current.getContext('2d').beginPath(); };
      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const ctx = canvasRef.current.getContext('2d');
        const { x, y } = getPos(e);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      };
      
      const clear = () => {
        const canvas = canvasRef.current;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
          <div className="bg-white p-5 rounded-2xl w-full max-w-md shadow-2xl">
            <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-slate-800 text-sm">Tanda Tangan {roleTitle}</h3>
                <button onClick={onCancel} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
            </div>
            <div className="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 mb-4 h-48 overflow-hidden touch-none-canvas w-full relative">
              <canvas ref={canvasRef} onMouseDown={startDraw} onMouseUp={endDraw} onMouseMove={draw} onMouseLeave={endDraw}
                onTouchStart={startDraw} onTouchEnd={endDraw} onTouchMove={draw} className="w-full h-full cursor-crosshair absolute top-0 left-0" />
            </div>
            <div className="flex justify-between items-center">
              <button onClick={clear} className="text-xs text-red-600 font-bold flex items-center gap-1 hover:bg-red-50 px-2 py-1 rounded">
                <Eraser size={14}/> Hapus
              </button>
              <div className="flex gap-2">
                <button onClick={onCancel} className="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600">Batal</button>
                <button onClick={() => onSave(canvasRef.current.toDataURL())} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow">Simpan TTD</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const getLocalDate = () => {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().split('T')[0]; 
    };
    const getLocalMonth = () => getLocalDate().slice(0, 7); 

    function App() {
      const [auth, setAuth] = useState(() => JSON.parse(localStorage.getItem('jurnal7kaih_auth')) || null);
      const [activeTab, setActiveTab] = useState('login');
      
      // Menerapkan URL secara langsung
      const [scriptUrl, setScriptUrl] = useState(DEFAULT_ENDPOINT);
      
      const [showSetup, setShowSetup] = useState(false);
      const [toast, setToast] = useState({ show: false, msg: '', type: 'success' });
      const [syncStatus, setSyncStatus] = useState('Menghubungkan...');

      const [dbSiswa, setDbSiswa] = useState(DEFAULT_USERS);
      const [dbAkun, setDbAkun] = useState(DEFAULT_AKUN);
      const [localEntries, setLocalEntries] = useState(() => JSON.parse(localStorage.getItem('jurnal7kaih_entries')) || {});
      const [signatures, setSignatures] = useState(() => JSON.parse(localStorage.getItem('jurnal7kaih_signatures')) || {});
      const [notesData, setNotesData] = useState(() => JSON.parse(localStorage.getItem('jurnal7kaih_notes')) || {});
      
      const [selectedNis, setSelectedNis] = useState('');
      const [modalNilai, setModalNilai] = useState({ show: false, type: '', data: [] });
      const [modalSig, setModalSig] = useState({ show: false, role: '' });

      const fetchData = async (isBackground = false) => {
        if (!scriptUrl) return null;
        try {
          if (!isBackground) setSyncStatus('Menarik Data...');
          const cleanUrl = scriptUrl.trim();
          const reqUrl = cleanUrl.includes('?') ? `${cleanUrl}&action=getUsers` : `${cleanUrl}?action=getUsers`;
          
          const res = await fetch(reqUrl);
          
          // Cek apakah Google mengembalikan halaman HTML (Error Izin/Login)
          const contentType = res.headers.get("content-type");
          if (contentType && contentType.includes("text/html")) {
             throw new Error("Google memblokir akses. Pastikan 'Who has access' diubah menjadi 'Anyone'!");
          }

          const data = await res.json();
          
          if (data && data.siswa && data.akun) {
            setDbSiswa(data.siswa);
            setDbAkun(data.akun);
            setSyncStatus('Sheets Terhubung');
            return data; 
          }
        } catch (e) {
          console.warn("Fetch Error (URL Salah/CORS/Izin): ", e);
          setSyncStatus('Izin Akses Diblokir');
          if(!isBackground) showToast('Akses ditolak! Periksa izin Deployment Apps Script.', 'error');
        }
        return null;
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(() => fetchData(true), 30000); 
        return () => clearInterval(interval);
      }, [scriptUrl]);

      useEffect(() => {
        if (!auth) { setActiveTab('login'); return; }
        if (auth.role === 'siswa') { setActiveTab('input'); setSelectedNis(auth.nis); }
        else if (auth.role === 'wali') { setActiveTab('rekap'); setSelectedNis(''); }
        else if (auth.role === 'ortu') { setActiveTab('rekap'); setSelectedNis(auth.nisAnak); }
        else if (auth.role === 'admin') { setActiveTab('analitik'); setSelectedNis(''); }
      }, [auth]);

      const showToast = (msg, type = 'success') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'success' }), 3000);
      };

      const handlePostData = (action, payload) => {
        if (!scriptUrl) return;
        fetch(scriptUrl.trim(), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...payload })
        })
        .then(res => res.json())
        .then(data => console.log("Post Success:", data))
        .catch(e => console.error("Post Error:", e));
      };

      const getFilteredStudents = () => {
        if (auth?.role === 'wali') {
            const authKelas = String(auth.kelas || '').trim().toUpperCase();
            return dbSiswa.filter(u => String(u.kelas || '').trim().toUpperCase() === authKelas);
        }
        if (auth?.role === 'ortu') {
            const authAnak = String(auth.nisAnak || '').trim();
            return dbSiswa.filter(u => String(u.nis || '').trim() === authAnak);
        }
        if (auth?.role === 'siswa') {
            return dbSiswa.filter(u => String(u.nis || '').trim() === String(auth.nis || '').trim());
        }
        return dbSiswa; // Admin lihat semua
      };

      const getStudentProfile = (nis) => dbSiswa.find(u => String(u.nis).trim() === String(nis).trim()) || { nama: 'Siswa Belum Ditemukan', kelas: '-', nis, agama: 'Islam', walikelas: '-', ortu: '-' };

      const Header = () => (
        <header className="bg-indigo-700 text-white shadow-lg sticky top-0 z-40 no-print">
          <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-800 p-2 rounded-lg border border-indigo-500 hidden sm:block"><BookOpen className="text-amber-400" size={24} /></div>
              <div><h1 className="text-lg md:text-xl font-bold leading-tight">Jurnal 7KAIH</h1><p className="text-[10px] md:text-xs text-indigo-200">7 Kebiasaan Anak Indonesia Hebat</p></div>
            </div>
            <div className="flex items-center gap-2 md:gap-3">
              <div className="hidden md:flex items-center gap-1.5 text-[10px] md:text-xs bg-indigo-800 px-3 py-1.5 rounded-full text-indigo-200">
                <div className={`w-2 h-2 rounded-full ${syncStatus === 'Sheets Terhubung' ? 'bg-emerald-400 animate-pulse' : 'bg-slate-400'}`}></div>
                {syncStatus}
              </div>
              {/* Opsi Cloud Download disembunyikan/dipertahankan tergantung kebutuhan, kita tetap sediakan */}
              <button onClick={() => setShowSetup(true)} className="p-2 hover:bg-indigo-600 rounded-lg text-indigo-100 hover:text-white" title="Info Sistem"><CloudDownload size={20}/></button>
              {auth && (
                <div className="flex items-center gap-2 pl-2 border-l border-indigo-500">
                  <div className="text-right hidden sm:block">
                    <p className="font-bold text-xs text-white">{auth.nama || (auth.profile ? auth.profile.nama : 'User')}</p>
                    <p className="text-[10px] text-indigo-200 capitalize">{auth.role === 'wali' ? 'Guru Wali' : auth.role}</p>
                  </div>
                  <button onClick={() => { setAuth(null); localStorage.removeItem('jurnal7kaih_auth'); }} className="p-2 bg-red-500 hover:bg-red-600 rounded-lg text-white" title="Logout"><LogOut size={16}/></button>
                </div>
              )}
            </div>
          </div>
          {auth && (
            <nav className="bg-indigo-800 px-2 md:px-4 text-[11px] md:text-sm flex justify-start md:justify-center gap-2 md:gap-4 overflow-x-auto border-t border-indigo-600 scrollbar-hide">
              {auth.role === 'siswa' && (
                <>
                  <TabBtn id="input" icon={<PenTool size={14}/>} label="Input Jurnal" />
                  <TabBtn id="rekap" icon={<FileText size={14}/>} label="Rekap Bulanan" />
                  <TabBtn id="akademik" icon={<Activity size={14}/>} label="Akademik" />
                  <TabBtn id="profile" icon={<User size={14}/>} label="Data Diri" />
                </>
              )}
              {auth.role === 'wali' && (
                <>
                  <TabBtn id="rekap" icon={<FileText size={14}/>} label="Rekap Murid" />
                  <TabBtn id="akademik" icon={<Activity size={14}/>} label="Akademik" />
                  <TabBtn id="admin" icon={<ShieldCheck size={14}/>} label="Pantauan TTD" />
                  <TabBtn id="analitik" icon={<ChartPie size={14}/>} label="Analitik Kelas" />
                </>
              )}
              {auth.role === 'ortu' && (
                <>
                  <TabBtn id="rekap" icon={<FileText size={14}/>} label="Pantau Jurnal" />
                  <TabBtn id="akademik" icon={<Activity size={14}/>} label="Rapor Akademik" />
                </>
              )}
              {auth.role === 'admin' && (
                <>
                  <TabBtn id="analitik" icon={<ChartPie size={14}/>} label="Analitik Global" />
                  <TabBtn id="admin" icon={<Users size={14}/>} label="Dashboard TTD" />
                  <TabBtn id="rekap" icon={<FileText size={14}/>} label="Semua Laporan" />
                </>
              )}
            </nav>
          )}
        </header>
      );

      const TabBtn = ({ id, icon, label }) => (
        <button onClick={() => setActiveTab(id)} className={`py-3 px-2 flex items-center gap-1.5 font-medium whitespace-nowrap transition-colors ${activeTab === id ? 'text-white border-b-2 border-amber-400' : 'text-indigo-200 hover:text-white'}`}>
          {icon} {label}
        </button>
      );

      const LoginSection = () => {
        const [role, setRole] = useState('siswa');
        const [id, setId] = useState('');
        const [pass, setPass] = useState('');
        const [loading, setLoading] = useState(false);

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          
          if (!scriptUrl) {
            setLoading(false);
            showToast('Sistem belum terhubung ke database utama.', 'error');
            return;
          }

          // 1. Tarik Data Segar (Real-time) saat tombol diklik
          const latestData = await fetchData(true);
          setLoading(false);

          const currentAkunData = latestData && latestData.akun ? latestData.akun : dbAkun;
          const currentSiswaData = latestData && latestData.siswa ? latestData.siswa : dbSiswa;

          if (!currentAkunData || currentAkunData.length === 0) {
            showToast('Data Akun dari Spreadsheet kosong! Pastikan baris Akun sudah terisi.', 'error');
            return;
          }

          // 2. Pencarian Validasi Super Kuat
          console.log(`Mencari Login: Role=${role}, ID="${id}", Pass="${pass}"`);

          const validAccount = currentAkunData.find(a => {
            const sheetRole = String(a.role || '').trim().toLowerCase();
            const sheetUser = String(a.username || a.nip || a.id || '').trim().toLowerCase();
            const sheetPass = String(a.password || a.pass || a.sandi || '').trim();

            let roleMatch = false;
            if (role === 'wali' && (sheetRole.includes('wali') || sheetRole.includes('guru'))) roleMatch = true;
            else if (role === 'ortu' && (sheetRole.includes('ortu') || sheetRole.includes('orang') || sheetRole.includes('tua'))) roleMatch = true;
            else if (sheetRole === role) roleMatch = true;

            const userMatch = sheetUser === String(id).trim().toLowerCase();
            const passMatch = sheetPass === String(pass).trim();
            
            if(roleMatch && userMatch && !passMatch) {
               console.warn(`[Akun Ketemu] Tapi Password salah! Sheet:"${sheetPass}" Ketikan:"${pass}"`);
            }

            return roleMatch && userMatch && passMatch;
          });

          if (validAccount) {
            let authData = {};
            const sheetNama = validAccount.nama || validAccount.keterangan || '';
            const sheetTarget = validAccount.target || validAccount.kelas || validAccount.nisn || '';
            
            if (role === 'siswa') {
              const user = currentSiswaData.find(u => String(u.nis).trim() === String(id).trim());
              authData = { role: 'siswa', nis: String(id).trim(), nama: sheetNama, profile: user || { nama: sheetNama || `Siswa (${id})`, kelas: 'UMUM', nis: id, agama: 'Islam' } };
            }
            else if (role === 'ortu') {
              const childNis = String(sheetTarget).trim();
              const user = currentSiswaData.find(u => String(u.nis).trim() === childNis);
              authData = { role: 'ortu', nisAnak: childNis, nama: sheetNama || 'Orang Tua', profileAnak: user };
              if (!childNis) showToast('PERINGATAN: Kolom Target kosong di Spreadsheet!', 'error');
            }
            else if (role === 'wali') {
              const targetKelas = String(sheetTarget).trim();
              authData = { role: 'wali', id: String(id).trim(), nama: sheetNama || 'Guru Wali', kelas: targetKelas };
              if (!targetKelas) showToast('PERINGATAN: Kolom Target Kelas kosong di Spreadsheet!', 'error');
            }
            else if (role === 'admin') {
              authData = { role: 'admin', id: String(id).trim(), nama: sheetNama || 'Administrator', kelas: 'ALL' };
            }

            localStorage.setItem('jurnal7kaih_auth', JSON.stringify(authData));
            setAuth(authData);
            showToast(`Login Berhasil sebagai ${role.toUpperCase()}`);
          } else {
            console.error("Login Gagal: Tidak ada kecocokan 100% pada sheet Akun.");
            showToast('Login Gagal! NIP/NISN atau Password tidak cocok.', 'error');
          }
        };

        return (
          <section className="max-w-md mx-auto my-8 bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200">
            <div className="text-center mb-6">
              <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner"><UserCheck size={32}/></div>
              <h2 className="text-2xl font-bold text-slate-800">Login 7KAIH</h2>
              <p className="text-xs text-slate-500 mt-1">Sistem Terintegrasi Google Sheets</p>
            </div>
            
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 bg-slate-100 p-1.5 rounded-xl mb-6 text-[11px] font-bold">
              {['siswa', 'wali', 'ortu', 'admin'].map(r => (
                <button key={r} type="button" onClick={() => setRole(r)} className={`py-2.5 rounded-lg capitalize ${role === r ? 'bg-white text-indigo-700 shadow border border-slate-200' : 'text-slate-500 hover:bg-slate-200'}`}>
                  {r === 'wali' ? 'Guru Wali' : r}
                </button>
              ))}
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  {role === 'siswa' ? 'NISN Siswa' : role === 'wali' ? 'NIP Guru Wali' : role === 'ortu' ? 'Username Orang Tua' : 'Username Admin'}
                </label>
                <input type="text" required value={id} onChange={e=>setId(e.target.value)} 
                    placeholder="Masukkan ID / Username..." 
                    className="w-full px-4 py-3 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Kata Sandi</label>
                <input type="password" required value={pass} onChange={e=>setPass(e.target.value)} placeholder="Masukkan Sandi..." className="w-full px-4 py-3 border rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                {loading ? <Activity className="animate-spin" size={20}/> : <ShieldCheck size={20}/>} {loading ? 'Memverifikasi...' : 'Masuk Sekarang'}
              </button>
            </form>
          </section>
        );
      };

      const ProfileSection = () => {
        if(!auth || auth.role !== 'siswa') return null;
        const [prof, setProf] = useState(auth.profile || {nama:'', kelas:'', nis:auth.nis, agama:'Islam', walikelas:'', ortu:''});
        
        const saveProf = (e) => {
          e.preventDefault();
          const newAuth = {...auth, profile: prof};
          setAuth(newAuth); localStorage.setItem('jurnal7kaih_auth', JSON.stringify(newAuth));
          handlePostData('saveProfile', { data: prof });
          showToast('Data Profil Tersimpan!');
        };

        return (
          <div className="bg-white rounded-2xl shadow-md p-6 border border-slate-200 max-w-2xl mx-auto">
            <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2"><User className="text-indigo-600"/> Data Diri Siswa</h2>
            <form onSubmit={saveProf} className="space-y-4">
              <div><label className="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label><input type="text" required value={prof.nama} onChange={e=>setProf({...prof, nama:e.target.value})} className="w-full p-2.5 border rounded-xl bg-slate-50 text-sm" /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-xs font-semibold text-slate-700 mb-1">Kelas</label><input type="text" required value={prof.kelas} onChange={e=>setProf({...prof, kelas:e.target.value})} className="w-full p-2.5 border rounded-xl bg-slate-50 text-sm" /></div>
                <div><label className="block text-xs font-semibold text-slate-700 mb-1">NISN</label><input type="text" readOnly value={prof.nis} className="w-full p-2.5 border rounded-xl bg-slate-100 text-sm text-slate-500" /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Agama</label>

                          {['subuh', 'zuhur', 'asar', 'magrib', 'isya'].map(w => {

                     <div key={w} className="bg-slate-50 p-3 rounded-xl border">
                        <label className="block text-xs font-bold text-slate-800 mb-2 capitalize">Makan {w}</label>
                        <input type="text" name={`${w}Menu`} defaultValue={todayEntry.makan?.[w]?.menu || ''} placeholder={`Menu ${w}...`} className="w-full p-1.5 border rounded mb-2 text-xs" />
                        <select name={`${w}Status`} defaultValue={todayEntry.makan?.[w]?.status || 'Habis'} className="w-full p-1.5 border rounded text-xs bg-white">
                            <option value="Habis">Habis</option><option value="Tidak Habis">Tidak Habis</option><option value="Tidak Makan">Tidak Makan</option>
                        </select>
                     </div>
                 ))}
              </div>
              <button type="submit" className={`text-white text-xs px-4 py-2 rounded-xl font-bold shadow ${todayEntry.makan ? 'bg-orange-800 hover:bg-orange-900' : 'bg-orange-600 hover:bg-orange-700'}`}>

              </button>

            <form onSubmit={e => submitHabit(e, 'belajar', { jam: e.target.elements.jam.value, mapel: e.target.elements.mapel.value })} className="bg-white p-5 rounded-2xl shadow border-l-4 border-purple-400">
              <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4 border-b pb-2"><span className="bg-purple-100 text-purple-700 w-6 h-6 rounded flex items-center justify-center font-bold text-xs">5</span> Gemar Belajar</h3>

                <div><label className="block text-xs font-bold text-slate-500 mb-1">Jam Belajar Mandiri</label><input type="time" name="jam" required defaultValue={todayEntry.belajar?.jam || ''} className="w-full p-2 border rounded-xl text-sm bg-slate-50" /></div>

              </div>
              <button type="submit" className={`text-white text-xs px-4 py-2 rounded-xl font-bold shadow ${todayEntry.belajar ? 'bg-purple-800 hover:bg-purple-900' : 'bg-purple-600 hover:bg-purple-700'}`}>
                  {todayEntry.belajar ? '✓ Tersimpan (Perbarui Bagian 5)' : 'Kirim Bagian 5'}
              </button>

              </button>

          </div>
        );
      };

      const RekapSection = () => {
        const [monthVal, setMonthVal] = useState(getLocalMonth());
        const nisToRender = selectedNis || (auth?.nisAnak) || (auth?.nis) || (getFilteredStudents()[0]?.nis) || '';
        const student = getStudentProfile(nisToRender);
        const studentsList = getFilteredStudents();

        if(!student || !student.nis) return <div className="text-center p-4 text-slate-500 font-bold">Pilih siswa atau pastikan data siswa tersedia.</div>;

        const [y, m] = monthVal.split('-');
        const daysInMonth = y && m ? new Date(y, m, 0).getDate() : 0;
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const displayMonth = m ? `${monthNames[parseInt(m)-1]} ${y}` : '-';

        const entries = localEntries[student.nis] || {};
        const notes = notesData[student.nis]?.[monthVal] || {};
        const sigs = signatures[student.nis]?.[monthVal] || {};

        const editCatatan = (role) => {
            const currentNote = notes[role] || '';
            const newNote = prompt(`Masukkan Catatan ${role === 'ortu' ? 'Orang Tua' : 'Guru Wali'}:`, currentNote);
            if(newNote !== null) {
                const updated = {...notesData};
                if(!updated[student.nis]) updated[student.nis] = {};
                if(!updated[student.nis][monthVal]) updated[student.nis][monthVal] = {};
                updated[student.nis][monthVal][role] = newNote;
                
                setNotesData(updated); 
                localStorage.setItem('jurnal7kaih_notes', JSON.stringify(updated));
                handlePostData('saveNote', { nis: student.nis, month: monthVal, role, note: newNote });
                showToast('Catatan diperbarui!');
            }
        };

        const handleSaveSig = (dataURL) => {
            const updated = {...signatures};
            if(!updated[student.nis]) updated[student.nis] = {};
            if(!updated[student.nis][monthVal]) updated[student.nis][monthVal] = {};
            updated[student.nis][monthVal][modalSig.role] = dataURL;
            
            setSignatures(updated); 
            localStorage.setItem('jurnal7kaih_signatures', JSON.stringify(updated));
            handlePostData('saveSignature', { nis: student.nis, month: monthVal, role: modalSig.role, signature: dataURL });
            setModalSig({show:false, role:''});
            showToast('Tanda tangan tersimpan!');
        };

        return (
          <div className="space-y-6">
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between no-print">
                <div className="flex flex-wrap items-center gap-3">
                    <div>
                        <label className="text-xs font-bold text-slate-600 block mb-1">Filter Bulan:</label>
                        <input type="month" value={monthVal} onChange={e=>setMonthVal(e.target.value)} className="p-2 border rounded-xl text-sm bg-slate-50 font-mono"/>
                    </div>
                    {(auth?.role === 'wali' || auth?.role === 'admin') && (
                        <div>

                            <select value={nisToRender} onChange={e=>setSelectedNis(e.target.value)} className="p-2 border rounded-xl text-sm bg-white font-semibold text-slate-700">
                                {studentsList.map(u => <option key={u.nis} value={u.nis}>{u.nama} ({u.kelas})</option>)}
                            </select>

            </div>

                    <p className="text-xs md:text-sm font-semibold text-slate-600">7 Kebiasaan Anak Indonesia Hebat</p>
                    <p className="text-xs font-mono text-indigo-700 font-bold mt-1">Periode: {displayMonth}</p>
                </div>

                    <div><span className="text-slate-500">Kelas:</span> <strong className="text-slate-900">{student.kelas}</strong></div>
                    <div><span className="text-slate-500">NISN:</span> <strong className="text-slate-900 font-mono">{student.nis}</strong></div>
                    <div><span className="text-slate-500">Agama:</span> <strong className="text-slate-900">{student.agama}</strong></div>
                </div>

                    <table className="w-full text-[10px] md:text-xs text-left border-collapse border border-slate-300">
                        <thead>
                            <tr className="bg-indigo-50 text-indigo-950 border-b border-slate-300 font-bold text-center">
                                <th className="p-2 border border-slate-300 w-8">Tgl</th>
                                <th className="p-2 border border-slate-300">1. Bangun</th><th className="p-2 border border-slate-300">2. Ibadah</th>
                                <th className="p-2 border border-slate-300">3. Olahraga</th><th className="p-2 border border-slate-300">4. Makan</th>
                                <th className="p-2 border border-slate-300">5. Belajar</th><th className="p-2 border border-slate-300">6. Masyarakat</th>
                                <th className="p-2 border border-slate-300">7. Tidur</th>
                            </tr>
                        </thead>
                        <tbody>
                            {Array.from({length: daysInMonth}, (_, i) => {
                                const d = i + 1;
                                const dateStr = `${y}-${m}-${String(d).padStart(2,'0')}`;
                                const e = entries[dateStr] || {};
                                
                                let b2Text = '-';
                                if (e.ibadah?.salat) {
                                    const s = Object.keys(e.ibadah.salat).map(k => k.substring(0,3).toUpperCase()).join(', ');
                                    b2Text = <><span className="font-bold text-emerald-700">{s}</span> {e.ibadah.lain && <><br/>{e.ibadah.lain}</>}</>;

                                let b4Text = '-';
                                if (e.makan) {
                                    const p = e.makan.pagi?.status === 'Habis' ? 'P' : ''; const s = e.makan.siang?.status === 'Habis' ? 'S' : ''; const mal = e.makan.malam?.status === 'Habis' ? 'M' : '';
                                    b4Text = [p,s,mal].filter(Boolean).join('/') || '-';
                                }

                                return (
                                    <tr key={d} className={d % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}>

      const AdminAnalyticsSection = () => {
        const [periodType, setPeriodType] = useState('daily');
        const [dateVal, setDateVal] = useState(getLocalDate());
        const [weekVal, setWeekVal] = useState('');
        const [monthVal, setMonthVal] = useState(getLocalMonth());
        const [classFilter, setClassFilter] = useState(auth?.role === 'wali' ? auth.kelas : 'ALL');
        const [partFilter, setPartFilter] = useState('ALL');

        const getTargetAndDates = () => {
          let dates = []; 
          if (periodType === 'daily') { dates = [dateVal]; }
          else if (periodType === 'weekly' && weekVal) {
            const [y, w] = weekVal.split('-W');
            if(y && w) {
              const d = new Date(y, 0, 4); const day = d.getDay() || 7;
              d.setDate(d.getDate() - day + 1 + (parseInt(w) - 1) * 7);
              for(let i=0; i<5; i++) {
                const cur = new Date(d); cur.setDate(d.getDate() + i);
                dates.push(cur.toISOString().split('T')[0]);
              }
            }
          } else if (periodType === 'monthly' && monthVal) {
            const [y, m] = monthVal.split('-');
            if(y && m) {
              const daysInMonth = new Date(y, m, 0).getDate();
              for(let i=1; i<=daysInMonth; i++) dates.push(`${y}-${m}-${String(i).padStart(2,'0')}`);
            }
          }
          
          const activeHabits = partFilter === 'ALL' ? HABITS_INFO.map(h => h.key) : [partFilter];
          const target = dates.length * activeHabits.length;
          return { dates, target, activeHabits };
        };

        const students = classFilter === 'ALL' ? dbSiswa : dbSiswa.filter(s => String(s.kelas).toUpperCase() === classFilter.toUpperCase());
        const { dates, target, activeHabits } = getTargetAndDates();

        return (
          <div className="space-y-6">

                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">Pilih Waktu:</label>
                  {periodType === 'daily' && <input type="date" value={dateVal} onChange={e=>setDateVal(e.target.value)} className="p-2 border rounded-xl text-sm bg-slate-50" />}
                  {periodType === 'weekly' && <input type="week" value={weekVal} onChange={e=>setWeekVal(e.target.value)} className="p-2 border rounded-xl text-sm bg-slate-50" />}
                  {periodType === 'monthly' && <input type="month" value={monthVal} onChange={e=>setMonthVal(e.target.value)} className="p-2 border rounded-xl text-sm bg-slate-50" />}

                    <select value={classFilter} onChange={e=>setClassFilter(e.target.value)} className="p-2 border rounded-xl text-sm bg-slate-50">
                      <option value="ALL">Semua Kelas</option>
                      {[...new Set(dbSiswa.map(s => s.kelas))].map(c => <option key={c} value={c}>{c}</option>)}

                </div>
              </div>
            </div>

                <p className="text-xs text-slate-300">Target Evaluasi: {target} Ceklis/Siswa</p>
              </div>

                <table className="w-full text-sm text-left border-collapse border border-slate-300">
                  <thead>
                    <tr className="bg-indigo-50 text-indigo-900 border-b border-slate-300">
                      <th className="p-2 border border-slate-300 w-10 text-center">No</th>
                      <th className="p-2 border border-slate-300">Nama Siswa</th>
                      <th className="p-2 border border-slate-300 text-center">Kelas</th>
                      <th className="p-2 border border-slate-300 text-center w-64">Rincian Bagian Diisi</th>
                      <th className="p-2 border border-slate-300 text-center">Total Capaian</th>
                      <th className="p-2 border border-slate-300 text-center">Persentase</th>
                      <th className="p-2 border border-slate-300 text-center">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {students.map((s, i) => {
                      let filledCount = 0;
                      let habitCounts = {};
                      HABITS_INFO.forEach(h => habitCounts[h.key] = 0);

                      dates.forEach(d => {
                         const dayData = localEntries[s.nis]?.[d] || {};
                         HABITS_INFO.forEach(h => {
                             if (dayData[h.key] && Object.keys(dayData[h.key]).length > 0) {
                                 habitCounts[h.key]++;
                                 if (activeHabits.includes(h.key)) filledCount++;
                             }
                         });
                      });

                      if(filledCount > target) filledCount = target;
                      const pct = target > 0 ? Math.round((filledCount/target)*100) : 0;
                      
                      let badge = <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">Kurang Aktif</span>;
                      if(pct >= 80) badge = <span className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">Sangat Baik</span>;
                      else if(pct >= 50) badge = <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">Cukup Aktif</span>;

                      let rincianUI = null;
                      if (periodType === 'daily') {
                          rincianUI = (
                              <div className="flex flex-wrap gap-1 justify-center">
                                  {activeHabits.map((hKey) => {
                                      const info = HABITS_INFO.find(x => x.key === hKey);
                                      if (!info) return null;
                                      const isDone = habitCounts[hKey] > 0;
                                      return (
                                          <span key={hKey} title={`${info.label}: ${isDone ? 'Sudah Diisi' : 'Belum'}`} 
                                              className={`w-6 h-6 flex items-center justify-center rounded text-[10px] font-bold border cursor-help transition ${isDone ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                                              {HABITS_INFO.findIndex(x => x.key === hKey) + 1}
                                          </span>
                                      )
                                  })}
                              </div>
                          );
                      } else {
                          rincianUI = (
                              <div className="text-[10px] grid grid-cols-2 gap-x-3 gap-y-1.5 text-left px-2">
                                  {activeHabits.map((hKey) => {
                                      const info = HABITS_INFO.find(x => x.key === hKey);
                                      if (!info) return null;
                                      return (
                                          <div key={hKey} className="flex justify-between border-b border-slate-100 pb-0.5">
                                              <span className="text-slate-500 truncate mr-2" title={info.label}>{info.short}</span>
                                              <span className="font-bold text-slate-700">{habitCounts[hKey]}/{dates.length}</span>
                                          </div>
                                      )
                                  })}
                              </div>
                          );
                      }

                      return (
                        <tr key={s.nis} className="hover:bg-slate-50 border-b border-slate-200">
                          <td className="p-2 border border-slate-300 text-center font-bold text-slate-500">{i+1}</td>
                          <td className="p-2 border border-slate-300 font-semibold text-slate-800">{s.nama}</td>
                          <td className="p-2 border border-slate-300 text-center text-xs text-indigo-700 font-bold">{s.kelas}</td>
                          <td className="p-2 border border-slate-300 text-center align-middle">{rincianUI}</td>
                          <td className="p-2 border border-slate-300 text-center font-mono font-bold text-slate-700">{filledCount} / {target}</td>
                          <td className="p-2 border border-slate-300 text-center font-bold text-slate-800">{pct}%</td>
                          <td className="p-2 border border-slate-300 text-center">{badge}</td>
                        </tr>
                      )
                    })}
                    {students.length === 0 && <tr><td colSpan="7" className="p-4 text-center text-slate-500">Tidak ada data.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col min-h-screen">
          <Header />
          <main className="max-w-6xl mx-auto p-4 md:p-6 flex-1 w-full mb-12 relative">
            
            {toast.show && (
              <div className={`fixed bottom-5 right-5 px-5 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-3 text-white transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                {toast.type === 'error' ? <AlertTriangle size={20}/> : <CheckCircle size={20} />}
                <div><p className="font-bold text-sm">{toast.type === 'error' ? 'Gagal' : 'Sukses'}</p><p className="text-xs">{toast.msg}</p></div>
              </div>
            )}

            {activeTab === 'login' && <LoginSection />}
            {activeTab === 'profile' && <ProfileSection />}
            {activeTab === 'input' && <InputSection />}
            {activeTab === 'rekap' && <RekapSection />}
            {activeTab === 'akademik' && <AkademikSection />}
            {activeTab === 'admin' && <AdminTTDSection />}
            {activeTab === 'analitik' && <AdminAnalyticsSection />}

            {showSetup && (
              <div className="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl p-6">
                  <h3 className="font-bold text-indigo-700 mb-2 flex items-center gap-2"><FileSpreadsheet/> Info Sistem Database</h3>
                  <p className="text-xs text-slate-500 mb-4">Aplikasi ini sudah tertanam secara langsung ke Web App Endpoint Anda.</p>
                  <input type="url" value={scriptUrl} onChange={e=>setScriptUrl(e.target.value)} readOnly className="w-full p-3 border rounded-xl text-xs font-mono bg-slate-100 text-slate-500 mb-4 outline-none" />
                  <div className="flex justify-end gap-2">
                    <button onClick={() => setShowSetup(false)} className="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Tutup</button>
                    <button onClick={() => { localStorage.setItem('jurnal7kaih_script', scriptUrl); setShowSetup(false); fetchData(); showToast('Endpoint Disimpan! Menarik data...'); }} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow">Hubungkan Ulang</button>
                  </div>
                </div>
              </div>
            )}

            {modalNilai.show && (
                <div className="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="font-bold text-slate-800 flex items-center gap-2"><Book size={18} className="text-indigo-600"/> {modalNilai.type}</h3>
                            <button onClick={()=>setModalNilai({show:false, type:'', data:[]})} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
                        </div>
                        <ul className="space-y-2 mb-4 max-h-60 overflow-y-auto pr-2">
                            {modalNilai.data.length > 0 ? modalNilai.data.map((d, i) => (
                                <li key={i} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                                    <span className="text-xs font-semibold text-slate-700">{d.nama}</span>
                                    <span className={`text-sm font-black px-3 py-1 rounded-lg border ${d.nilai >= 75 ? 'text-emerald-700 bg-emerald-100 border-emerald-300' : 'text-red-700 bg-red-100 border-red-300'}`}>{d.nilai}</span>
                                </li>
                            )) : <li className="text-center text-xs text-slate-500 italic p-4">- Data Kosong -</li>}
                        </ul>
                        <button onClick={()=>setModalNilai({show:false, type:'', data:[]})} className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Tutup Rincian</button>
                    </div>
                </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
